<div class="bg-slate-50 p-6">
  <div class="mx-auto">
    <div class="mb-6">
      <a routerLink="/pacientes" class="text-sm font-medium text-blue-600 hover:text-blue-700">
        ← Voltar
      </a>

      <h1 class="mt-4 text-2xl font-medium text-slate-900">Novo paciente</h1>
      <p class="text-sm text-slate-500">Cadastre um novo paciente na clínica.</p>
    </div>

    <div class="rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
      <form (ngSubmit)="salvar()" class="space-y-5">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700"> Nome </label>
          <input
            type="text"
            name="nome"
            [(ngModel)]="paciente.nome"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="Ex: João Silva"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700"> Email </label>
          <input
            type="email"
            name="email"
            [(ngModel)]="paciente.email"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="joao@email.com"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700"> Telefone </label>
          <input
            type="text"
            name="telefone"
            [(ngModel)]="paciente.telefone"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="(81) 99999-9999"
          />
        </div>

        <div *ngIf="erro" class="rounded-lg bg-red-50 p-3 text-sm text-red-700">
          {{ erro }}
        </div>

        <div class="flex justify-end gap-3">
          <a
            routerLink="/pacientes"
            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100"
          >
            Cancelar
          </a>

          <button
            type="submit"
            [disabled]="salvando"
            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 cursor-pointer"
          >
            {{ salvando ? 'Salvando...' : 'Salvar paciente' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
